# cargo-deny's checks of the Rust dependencies, run from the repository root
# with `cargo deny --locked check`. Entries that let a dependency pass (allowed
# licenses, license exceptions, advisory ignores, sources) are added only when
# the user decides; otherwise they may only be removed. Bans (denied crates and
# features) are removed or narrowed only when the user decides; otherwise they
# may only be added.

[graph]
# Abyme builds on Unix only, and the devcontainer runs on these two.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# Optional features such as `json-schema` and `ts` pull in crates as well.
all-features = true

[advisories]
# A vulnerability, an unsound or unmaintained crate wherever it sits in the
# graph, and a yanked version fail the check, unless an entry in `ignore` names
# the advisory by its ID.
unmaintained = "all"
unsound = "all"
yanked = "deny"

[[advisories.ignore]]
id = "RUSTSEC-2024-0429"
reason = """glib 0.18 comes with gtk-rs, which Tauri uses on Linux. The unsound \
`Variant::array_iter_str` (`VariantStrIter`) is called neither by Abyme nor by \
Tauri's GTK stack. Remove once Tauri uses glib 0.20 or later on Linux."""

[[advisories.ignore]]
id = "RUSTSEC-2024-0436"
reason = """paste is a build-time proc-macro of arrow-flight and lance-bitpacking \
in lancedb, and of tokenizers in fastembed. Remove once neither lancedb's nor \
fastembed's tree contains paste."""

[[advisories.ignore]]
id = "RUSTSEC-2024-0370"
reason = """proc-macro-error is a build-time proc-macro of glib-macros 0.18 in \
gtk-rs, which Tauri uses on Linux. Remove once Tauri moves off gtk-rs 0.18."""

[[advisories.ignore]]
id = "RUSTSEC-2024-0449"
reason = """unsafe-libyaml comes through serde_yaml_ng in lindera, which lancedb \
0.40 always compiles into lance-index. Abyme's full-text index uses lance's \
`simple` tokenizer, and lindera parses YAML only for a `lindera/*` tokenizer, \
which Abyme does not select. Remove once lancedb no longer enables lindera or \
lindera drops serde_yaml_ng."""

# The zstd ignores below rest on how arrow-ipc and lance-encoding call zstd,
# which this check cannot see. When lancedb, arrow-ipc or lance-encoding
# changes, search their sources for `with_context`, `write::Decoder`,
# `context_mut`, `decompress_stream`, `compress_stream`, `NbWorkers`,
# `around_pos`, `zstd::dict` / `from_samples` / `from_continuous` /
# `from_files`, and `zstd_safe::`; each hit can invalidate a reason below.

[[advisories.ignore]]
id = "RUSTSEC-2026-0391"
reason = """zstd 0.13.3 and zstd-safe 7.3.0 come with lancedb through \
arrow-ipc and lance-encoding. Neither Abyme, arrow-ipc nor lance-encoding \
calls the `with_context` constructors of `stream::raw::Encoder` and `Decoder`, \
nor `read::Decoder::with_context` and `write::Encoder::with_context`, which \
wrap them; every stream gets a context of its own. Remove once lancedb's tree \
has no zstd below 0.14.3 and no zstd-safe below 8.2.0."""

[[advisories.ignore]]
id = "RUSTSEC-2026-0395"
reason = """zstd 0.13.3 and zstd-safe 7.3.0 come with lancedb through \
arrow-ipc and lance-encoding. `CCtx::set_parameter` runs, but \
`CParameter::StableInBuffer` exists only with zstd-safe's `experimental` \
feature, which no crate enables and this file bans. Remove once lancedb's tree \
has no zstd below 0.14.3 and no zstd-safe below 8.2.0."""

[[advisories.ignore]]
id = "RUSTSEC-2026-0396"
reason = """zstd 0.13.3 and zstd-safe 7.3.0 come with lancedb through \
arrow-ipc and lance-encoding. The `seekable` module (`Seekable`, \
`AdvancedSeekable`, `SeekableCStream`) exists only with zstd-safe's `seekable` \
feature, which no crate enables and this file bans. Remove once lancedb's tree \
has no zstd below 0.14.3 and no zstd-safe below 8.2.0."""

[[advisories.ignore]]
id = "RUSTSEC-2026-0397"
reason = """zstd 0.13.3 and zstd-safe 7.3.0 come with lancedb through \
arrow-ipc and lance-encoding. `OutBuffer::around_pos` is called by neither \
Abyme, arrow-ipc, lance-encoding nor zstd 0.13.3 itself. Remove once lancedb's \
tree has no zstd below 0.14.3 and no zstd-safe below 8.2.0."""

[[advisories.ignore]]
id = "RUSTSEC-2026-0398"
reason = """zstd 0.13.3 and zstd-safe 7.3.0 come with lancedb through \
arrow-ipc and lance-encoding. The `seekable` module (`Seekable`, \
`AdvancedSeekable`, `SeekableCStream`) exists only with zstd-safe's `seekable` \
feature, which no crate enables and this file bans. Remove once lancedb's tree \
has no zstd below 0.14.3 and no zstd-safe below 8.2.0."""

[[advisories.ignore]]
id = "RUSTSEC-2026-0399"
reason = """zstd 0.13.3 and zstd-safe 7.3.0 come with lancedb through \
arrow-ipc and lance-encoding. `init_using_cdict` and `init_using_ddict` exist \
only with zstd-safe's `experimental` feature, which no crate enables and this \
file bans. Remove once lancedb's tree has no zstd below 0.14.3 and no \
zstd-safe below 8.2.0."""

[[advisories.ignore]]
id = "RUSTSEC-2026-0400"
reason = """zstd 0.13.3 and zstd-safe 7.3.0 come with lancedb through \
arrow-ipc and lance-encoding. `DCtx::decompress` runs on bulk decompressors \
(arrow-ipc reuses one, lance-encoding's `decompress_to_buffer` makes one per \
call), but nothing streams on a bulk context, so no stream is open when a \
one-shot call runs; no dictionary is used. Remove once lancedb's tree has no \
zstd below 0.14.3 and no zstd-safe below 8.2.0."""

[[advisories.ignore]]
id = "RUSTSEC-2026-0401"
reason = """zstd 0.13.3 and zstd-safe 7.3.0 come with lancedb through \
arrow-ipc and lance-encoding. `train_from_buffer` is reached only through \
`zstd::dict::from_continuous`, `from_samples` and `from_files`, which neither \
Abyme, arrow-ipc nor lance-encoding calls. Remove once lancedb's tree has no \
zstd below 0.14.3 and no zstd-safe below 8.2.0."""

[[advisories.ignore]]
id = "RUSTSEC-2026-0402"
reason = """zstd 0.13.3 and zstd-safe 7.3.0 come with lancedb through \
arrow-ipc and lance-encoding. `CCtx::try_clone` exists only with zstd-safe's \
`experimental` feature, and a multithreaded context needs `zstdmt` too; no \
crate enables either, and this file bans both. Remove once lancedb's tree has \
no zstd below 0.14.3 and no zstd-safe below 8.2.0."""

[[advisories.ignore]]
id = "RUSTSEC-2026-0403"
reason = """zstd 0.13.3 and zstd-safe 7.3.0 come with lancedb through \
arrow-ipc and lance-encoding. `DCtx::decompress_stream` runs only inside \
`stream::read::Decoder`, through lance-encoding's `copy_decode`, which the \
advisory names as unaffected; nothing uses `stream::write::Decoder` or calls \
`decompress_stream` with a `Vec<u8>` destination. Remove once lancedb's tree \
has no zstd below 0.14.3 and no zstd-safe below 8.2.0."""

[[advisories.ignore]]
id = "RUSTSEC-2026-0404"
reason = """zstd 0.13.3 and zstd-safe 7.3.0 come with lancedb through \
arrow-ipc and lance-encoding. `DCtx::try_clone` exists only with zstd-safe's \
`experimental` feature, which no crate enables and this file bans. Remove once \
lancedb's tree has no zstd below 0.14.3 and no zstd-safe below 8.2.0."""

[[advisories.ignore]]
id = "RUSTSEC-2026-0405"
reason = """zstd 0.13.3 and zstd-safe 7.3.0 come with lancedb through \
arrow-ipc and lance-encoding. The `seekable` module (`Seekable`, \
`AdvancedSeekable`, `SeekableCStream`) exists only with zstd-safe's `seekable` \
feature, which no crate enables and this file bans. Remove once lancedb's tree \
has no zstd below 0.14.3 and no zstd-safe below 8.2.0."""

[[advisories.ignore]]
id = "RUSTSEC-2026-0406"
reason = """zstd 0.13.3 and zstd-safe 7.3.0 come with lancedb through \
arrow-ipc and lance-encoding. `CCtx::set_parameter` and `load_dictionary` run \
when arrow-ipc and lance-encoding create their bulk compressors, but no crate \
sets `CParameter::NbWorkers`, and the bundled libzstd, built without \
multithreading because zstd-sys's `zstdmt` and `pkg-config` are banned, \
refuses any value but 0; no multithreaded frame ever starts. Remove once \
lancedb's tree has no zstd below 0.14.3 and no zstd-safe below 8.2.0."""

[licenses]
# Licenses that permit use in an MIT project without conditions beyond
# keeping notices.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# MPL-2.0 per crate, so that a new crate under it fails the check instead of
# passing unseen. The first four come with Tauri's build, `option-ext` with
# lancedb and Tauri.
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[bans]
# lancedb and Tauri pull in many crates in several versions.
multiple-versions = "allow"
wildcards = "deny"
# The workspace's crates depend on each other by path; none is published.
allow-wildcard-paths = true
deny = [
    { crate = "hf-hub", reason = "see the comment on fastembed in the root Cargo.toml" },
    # The ignores of RUSTSEC-2026-0391, 0397, 0400, 0401, 0403, and 0406 rest
    # on how only these crates call zstd and zstd-safe; the user decides
    # whether the bans stay once those ignores go.
    { crate = "zstd", wrappers = ["arrow-ipc", "lance-encoding"], reason = "the zstd advisory ignores rely on no other crate calling zstd" },
    { crate = "zstd-safe", wrappers = ["zstd"], reason = "the zstd advisory ignores rely on no other crate calling zstd-safe" },
]

# Features banned for every version of each crate that has the feature. Each
# reason names the comment in the root Cargo.toml that forbids the feature, or
# the advisory ignores that rely on the feature being off.
[[bans.features]]
crate = "fastembed"
deny = ["hf-hub", "hf-hub-native-tls", "hf-hub-rustls-tls", "online", "qwen3", "nomic-v2-moe"]
reason = "see the comment on fastembed in the root Cargo.toml"

[[bans.features]]
crate = "ort"
deny = ["load-dynamic"]
reason = "see the comment on ort in the root Cargo.toml"

[[bans.features]]
crate = "tauri"
deny = [
    "devtools",
    "protocol-asset",
    "webview-data-url",
    "isolation",
    "tray-icon",
    "unstable",
    "macos-private-api",
]
reason = "see the comment on tauri in the root Cargo.toml"

# toml 0.8, which the GTK crates' build scripts use, has no `unbounded`.
[[bans.features]]
crate = "toml:>=0.9"
deny = ["unbounded"]
reason = "see the comment on toml in the root Cargo.toml"

[[bans.features]]
crate = "ts-rs"
deny = ["format"]
reason = "see the comment on ts-rs in the root Cargo.toml"

[[bans.features]]
crate = "ureq"
deny = ["gzip"]
reason = "see the comment on ureq in the root Cargo.toml"

# The user decides whether the two zstd bans stay once the ignores they name
# go.
[[bans.features]]
crate = "zstd-safe"
deny = ["experimental", "zstdmt", "seekable"]
reason = "the ignores of RUSTSEC-2026-0395, 0396, 0398, 0399, 0402, 0404, and 0405 rely on these features being off"

[[bans.features]]
crate = "zstd-sys"
deny = ["zstdmt", "pkg-config"]
reason = "the ignores of RUSTSEC-2026-0402 and 0406 rely on the bundled libzstd without multithreading"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
