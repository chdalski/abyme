[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Christoph Dalski"]
license = "MIT"
publish = false

[workspace.dependencies]
abyme-core = { path = "crates/abyme-core" }
abyme-index = { path = "crates/abyme-index" }
abyme-model = { path = "crates/abyme-model" }
# Never `hf-hub*`, `online`, `qwen3`, or `nomic-v2-moe`: they pull in hf-hub, whose download
# follows the latest revision unchecked and reads HF_TOKEN and HF_HOME. ONNX Runtime comes
# prebuilt from ort's download, checked against the SHA-256 in ort-sys.
fastembed = { version = "=7.2.0", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
futures = "0.3.34"
# `remote` only because lancedb 0.40.0 does not compile without it (`Error::Http` used
# unconditionally in src/job.rs); drop it once upstream fixes that. Abyme connects
# only to absolute local paths, which never reach the remote client.
lancedb = { version = "=0.40.0", default-features = false, features = ["remote"] }
# Exactly the version fastembed pins; Abyme needs it only for the process-wide ONNX Runtime
# environment. Never `load-dynamic`: it would load the library from ORT_DYLIB_PATH at runtime.
ort = { version = "=2.0.0-rc.15", default-features = false }
proptest = "1.12.0"
rlsp-yaml-parser = "0.11.2"
rmcp = { version = "3.6.0", default-features = false, features = ["server", "macros", "transport-io"] }
rstest = "0.28.0"
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
# Never the `unbounded` feature: it lifts the parser's recursion limit.
toml = { version = "0.9.8", default-features = false, features = ["std", "parse", "serde"] }
# No `gzip`: model files arrive byte for byte as their pinned size and hash describe them.
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "platform-verifier"] }

[workspace.lints.clippy]
# https://github.com/rust-lang/cargo/issues/12918
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
indexing_slicing = "deny"
fallible_impl_from = "deny"
wildcard_enum_match_arm = "deny"
unneeded_field_pattern = "deny"
fn_params_excessive_bools = "deny"
must_use_candidate = "deny"
panic = "deny"
expect_used = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[workspace.lints.rust]
missing_docs = "warn"
warnings = "deny" # -D warnings

# Builds and tests keep line tables for the workspace's crates and no debug info for
# dependencies: full debug info of LanceDB and DataFusion made test binaries 2.5 GB
# each, and linking them in parallel exhausted the machine's memory.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
