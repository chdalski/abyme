[package]
name = "abyme-core"
description = "The Abyme core: operations on boards and elements, applied to the files in a repository"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
abyme-model.workspace = true
rustix.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
unicode-width.workspace = true

[features]
# JSON Schemas for the operations, so an MCP server can describe its tools;
# off unless a client needs them.
json-schema = ["dep:schemars", "abyme-model/json-schema"]

[dev-dependencies]
abyme-test-support.workspace = true
proptest.workspace = true
rstest.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
