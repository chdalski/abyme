[package]
name = "abyme-model"
description = "The Abyme format: identifiers and the files that hold elements and boards"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rlsp-yaml-parser.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }

[features]
# JSON Schemas for the types an AI sends over MCP; off unless a client needs them.
json-schema = ["dep:schemars"]
# TypeScript declarations for the types the canvas's UI receives; off unless the canvas needs them.
ts = ["dep:ts-rs"]

[dev-dependencies]
proptest.workspace = true
rstest.workspace = true

[lints]
workspace = true
