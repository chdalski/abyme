[package]
name = "abyme-mcp"
description = "The Abyme MCP server: lets an AI apply operations to an Abyme project and read its boards"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
abyme-core = { workspace = true, features = ["json-schema"] }
abyme-model = { workspace = true, features = ["json-schema"] }
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "time"] }

[lints]
workspace = true
